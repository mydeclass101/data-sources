name: data-sources

# ระบบต้นทางของร้าน (ฝั่ง SWE / partner) สำหรับให้ทีม DE ดึงข้อมูล · วิธีใช้ดูใน README.md
#   shop-db      : PostgreSQL ของร้าน (อ่านอย่างเดียว)          → localhost:5432 · ใน network: shop-db:5432
#   partner-drop : partner วางไฟล์ CSV ของเมื่อวานทุกคืน 01:00    → ./inbox/marketplace/
#   shop-api     : API ค่าโฆษณารายวัน                             → localhost:8000/docs · ใน network: shop-api:8000
# container อื่น (เช่น Airflow) ต่อเข้ามาได้ทาง network ชื่อ data-sources

services:
  # ---------- data source: ร้านค้า ----------
  shop-data:
    # ดาวน์โหลดไฟล์ข้อมูลร้านครั้งแรก (มีไฟล์ใน data/ แล้วจะข้าม)
    image: curlimages/curl:8.17.0
    user: "0:0"
    environment:
      DATA_URL: ${DATA_URL:-https://github.com/mydeclass101/de-class-session-7/releases/download/timeline-v1/shop_timeline.dump}
    volumes:
      - ./data:/data
      - ./docker/shop-db/download.sh:/download.sh:ro
    entrypoint: ["sh", "/download.sh"]
    networks:
        - data-sources

  shop-db:
    image: postgres:17.6
    container_name: de7-shop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    command: ["postgres", "-c", "timezone=Asia/Bangkok", "-c", "shared_buffers=256MB"]
    ports:
      - "127.0.0.1:${SHOP_DB_PORT:-5432}:5432"            # DBeaver: localhost:5432 database shop, student / student123
    volumes:
      - shop_data:/var/lib/postgresql/data
      - ./docker/shop-db/init:/docker-entrypoint-initdb.d:ro
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "test ! -f /var/lib/postgresql/data/COURSE_DATA_MISSING && psql -U student -d shop -tAc 'SELECT 1 FROM orders LIMIT 1' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10m                                      # ครั้งแรกต้อง restore ข้อมูล (ไม่กี่นาที)
    depends_on:
      shop-data:
        condition: service_completed_successfully
    networks:
      - data-sources

  # ---------- data source: marketplace partner (ไฟล์ CSV) และ API ค่าโฆษณา ----------
  partner-drop:
    build: ./docker/partner-drop
    container_name: de7-partner-drop
    restart: unless-stopped
    environment:
      SHOP_DSN: postgresql://student:student123@shop-db:5432/shop
      START_DATE: "2026-09-25"                               # ส่งไฟล์ของทุกวันตั้งแต่วันนี้
      BROKEN_DATES: ${PARTNER_BROKEN_DATES:-}                # วันที่ partner ส่งไฟล์คอลัมน์ผิด (แล้วส่ง _v2 ตอน 10:00)
      TZ: Asia/Bangkok
    volumes:
      - ./inbox/marketplace:/inbox/marketplace
    depends_on:
      shop-db:
        condition: service_healthy
    networks:
      - data-sources

  shop-api:
    build: ./docker/shop-api
    container_name: de7-shop-api
    restart: unless-stopped
    environment:
      API_KEY: class-demo-key
      FLAKY_RATE: ${FLAKY_RATE:-0.25}
    ports:
      - "127.0.0.1:${SHOP_API_PORT:-8000}:8000"
    networks:
      - data-sources


volumes:
  shop_data:


networks:
  data-sources:
    name: data-sources